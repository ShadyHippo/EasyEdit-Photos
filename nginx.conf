server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    # the whole repo is mounted for its static assets, so hide the non-public bits
    location ~ /\. { return 404; }
    location ~ ^/(docker-compose\.ya?ml|nginx\.conf|README\.md)$ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }

    # Same-origin proxy to the rembg container over the shared `easyedit` network.
    # The browser talks to this path, so there is no cross-origin/CORS involved at all
    # and it keeps working even if you later put the editor behind HTTPS.
    #
    # A variable + resolver is used (instead of a literal hostname) so nginx still
    # starts when rembg is down; a request just returns 502 until it comes back.
    location /bg/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $rembg_upstream http://rembg:7000;
        rewrite ^/bg/?(.*)$ /$1 break;
        proxy_pass $rembg_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
