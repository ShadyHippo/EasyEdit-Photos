services:
  editor:
    image: nginx:alpine
    container_name: easyedit
    restart: unless-stopped
    ports:
      - "3100:80"          # the editor UI
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - easyedit

  rembg:
    image: danielgatis/rembg:latest
    container_name: easyedit-rembg
    restart: unless-stopped
    # image entrypoint is `rembg`, so this runs: rembg s --host 0.0.0.0 --port 7000 --log_level info
    command: s --host 0.0.0.0 --port 7000 --log_level info
    environment:
      - U2NET_HOME=/models      # keep downloaded models on a volume
    ports:
      - "3101:7000"             # direct API access (optional, but handy)
    volumes:
      - rembg-models:/models
    networks:
      - easyedit

networks:
  easyedit:
    name: easyedit

volumes:
  rembg-models:
